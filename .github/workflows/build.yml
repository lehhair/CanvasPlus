name: build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      # runner 自带 Android SDK，只补 platform 和 build-tools
      - name: 安装 platform 36 和 build-tools 36
        run: |
          yes | sdkmanager --licenses > /dev/null 2>&1 || true
          sdkmanager "platforms;android-36" "build-tools;36.0.0"

      - name: 编译
        run: bash build.sh

      - uses: actions/upload-artifact@v4
        with:
          name: CanvasPlus
          path: dist/CanvasPlus.apk

      - name: 发版
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/CanvasPlus.apk
          generate_release_notes: true
